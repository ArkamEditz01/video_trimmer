workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: example
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter packages get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - example/build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - arkamking005@gmail.com

