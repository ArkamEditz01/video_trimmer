name: video_trimmer
description: A Flutter package for trimming videos.
version: 3.0.0
homepage: https://github.com/sbis04/video_trimmer

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: any
  path: any
  video_player: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.souvikbiswas.video_trimmer
        pluginClass: VideoTrimmerPlugin
      ios:
        pluginClass: VideoTrimmerPlugin
